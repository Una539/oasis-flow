[package]
name = "oflow"
version = "0.4.0"
edition = "2024"
description = "A focused todo CLI"
license = "MPL-2.0"

[lib]
name = "oflow"
path = "src/lib.rs"

[[bin]]
name = "oflow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "sqlite",
    "uuid",
    "chrono",
] }
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.0.6"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
directories = "6.0"
color-eyre = "0.6.3"
crossterm = "0.29.0"
ratatui = "0.30.0"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
